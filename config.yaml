# BookAgent v0.1 配置文件
# 所有非敏感配置项集中在此。Azure Key 等敏感信息只能放在 .env 中。

app:
  log_level: INFO
  # 书籍工作目录根路径（每本书在此下创建独立子目录）
  books_dir: books
  # 最终输出目录（如果用户未通过 --output-dir 指定，则使用书籍目录下的 output/）
  # output_dir: ""

validation:
  # 清洗后字符损失比例阈值，超过此值进入 NEEDS_REVIEW
  max_text_loss_ratio: 0.15
  # 最小字符数，低于此值视为异常
  min_chars: 1000
  # 最小章节数（如果为0则不检查）
  min_chapters: 0

chunking:
  # 默认最大 Chunk 字符数
  default_max_chars: 1000
  # Chunk 间停顿（毫秒）
  chunk_pause_ms: 150
  # 章节间停顿（毫秒）
  chapter_pause_ms: 1000

tts:
  # 默认 TTS 后端
  default_backend: kokoro
  # 单 Chunk 最大重试次数
  retry_count: 3
  # Worker 超时（秒）
  worker_timeout_seconds: 600

  kokoro:
    voice: "af_heart"
    speed: 1.0
    device: auto

  f5:
    speed: 1.0
    device: auto
    ref_audio: ""
    ref_text: ""
    cpu_fallback: true

  azure:
    voice: "zh-CN-XiaoxiaoNeural"
    rate: "1.0"
    volume: "1.0"

audio:
  # 统一采样率
  sample_rate: 24000
  # 统一声道数
  channels: 1
  # MP3 比特率
  mp3_bitrate: "128k"
  # Chunk 间静音填充（毫秒）
  chunk_pause_ms: 150
  # 章节间静音填充（毫秒）
  chapter_pause_ms: 1000
