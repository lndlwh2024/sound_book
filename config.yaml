# BookAgent v0.1 ????
# ?????????????Azure Key ????????? .env ??

app:
  log_level: INFO
  # ????????????????????????
  books_dir: books
  # ?????????????? --output-dir ???????????? output/?
  # output_dir: ""

validation:
  # ?????????????????? NEEDS_REVIEW
  max_text_loss_ratio: 0.15
  # ??????????????
  min_chars: 1000
  # ?????????0?????
  min_chapters: 0

chunking:
  # 默认 Chunk 字符数
  default_max_chars: 1000
  # Chunk 之间的微停顿
  chunk_pause_ms: 150
  # 章节之间的长停顿
  chapter_pause_ms: 1000
  # 模型外通用配置：小标题与正文之间的独立停顿时长（毫秒）
  heading_pause_ms: 800

# 模型外通用文本正规化配置（跨所有 TTS 模型生效）
normalization:
  enable_polyphone_fix: true  # 开启金融量词多音字（如两只股票）一声校准
  enable_year_oral: true      # 开启四位年份（含空格）口语位读转换
  enable_ratio_oral: true     # 开启比例与百分比口语化

tts:
  # ?? TTS ??
  default_backend: kokoro
  # ???????????
  models_dir: models
  # ? Chunk ??????
  retry_count: 3
  # Worker ?????
  worker_timeout_seconds: 600

  kokoro:
    # ????????
    repo_id: "hexgrad/Kokoro-82M-v1.1-zh"
    # ????????????????????????????????????????
    model_path: ""
    voice: "zm_yunjian"
    speed: 0.85
    device: cuda

  f5:
    # ????????????
    repo_id: "SWivid/F5-TTS"
    subfolder: "F5TTS_v1_Base"
    # ????????????????????????????????????????
    model_path: ""
    speed: 1.0
    device: auto
    ref_audio: ""
    ref_text: ""
    cpu_fallback: true

  azure:
    voice: "zh-CN-XiaoxiaoNeural"
    rate: "1.0"
    volume: "1.0"

audio:
  # ?????
  sample_rate: 24000
  # ?????
  channels: 1
  # MP3 ???
  mp3_bitrate: "128k"
  # Chunk ?????????
  chunk_pause_ms: 150
  # ???????????
  chapter_pause_ms: 1000
