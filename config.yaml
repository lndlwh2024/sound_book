app:
  log_level: INFO
  books_dir: books
  output_dir: output
normalization:
  enable_year_oral: true
  enable_polyphone_fix: true
  enable_third_tone_guard: true
  enable_bilingual_g2p: true
pauses:
  comma: 0.2
  colon: 0.28
  period: 0.4
  paragraph: 0.65
  chapter: 1.2
chunking:
  default_max_chars: 1000
  split_by_chapter: true
  output_chapter_mapping: true
  heading_pause_ms: 800
audio_output:
  sample_rate: 24000
  channels: 1
  mp3_bitrate: 128k
  trim_silence: true
tts:
  default_backend: kokoro
  models_dir: models
  retry_count: 3
  worker_timeout_seconds: 600
  kokoro:
    repo_id: hexgrad/Kokoro-82M
    model_path: ''
    voice: zm_yunjian
    speed: 0.85
    device: cuda
    blend_en_voice: am_onyx
    blend_en_ratio: 0.2
  f5:
    repo_id: SWivid/F5-TTS
    subfolder: F5TTS_v1_Base
    model_path: models/f5_tts/F5TTS_v1_Base
    device: cuda
    nfe_step: 16
    cfg_strength: 2.0
    speed: 1.0
    preset_voice: preset_male_e1_narrator
    preset_dir: models/f5_tts/presets
    available_presets:
      d1:
        name: "D1 (男生低音 - 商业精英)"
        audio: "models/f5_tts/presets/preset_male_d1_elite.wav"
        text: "在去年写给合伙人的信中，我写道："
      e1:
        name: "E1 (男生中声 - 巴菲特股东信旁白)"
        audio: "models/f5_tts/presets/preset_male_e1_narrator.wav"
        text: "例如大幅增加短期美债持有量和对日本五大商社的持续加码。"
    ref_audio: models/f5_tts/presets/preset_male_e1_narrator.wav
    ref_text: "例如大幅增加短期美债持有量和对日本五大商社的持续加码。"
  azure:
    voice: zh-CN-XiaoxiaoNeural
    rate: '1.0'
    volume: '1.0'
hardware:
  force_float32: true
  cooling_pause_seconds: 30
  gpu_temp_limit: 78
speech_unit:
  max_chars: 120
  max_sentences: 2
  min_chars: 10
video:
  default_layout: portrait_9_16
  fps: 30
  bg_blur_sigma: 20
  font_family: Microsoft YaHei
  title_font_size: 48
  subtitle_font_size: 38
